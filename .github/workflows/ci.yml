name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Memoria y Neo4j
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/redrelaciones2026
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p redrelaciones2026 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NEO4J_URL: bolt://localhost:7687
          NEO4J_CLAVE: redrelaciones2026
